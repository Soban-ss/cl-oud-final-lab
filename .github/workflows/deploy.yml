
name: Deploy Online Bookstore to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: bookstore-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      # Step 2: Configure AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::959756151844:role/GitHubActions-Bookstore-Deploy
          aws-region: ap-southeast-2

      # Step 3: Package Flask application
      - name: Package Flask application
        run: |
          zip -r deploy.zip \
            application.py \
            requirements.txt \
            Procfile \
            templates

      # Step 4: Upload application to S3
      - name: Upload application to S3
        run: |
          aws s3 cp deploy.zip \
            "s3://elasticbeanstalk-ap-southeast-2-959756151844/github-actions/${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.zip"

      # Step 5: Create a unique application version
      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name Online-Bookstore \
            --version-label "${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            --source-bundle \
            "S3Bucket=elasticbeanstalk-ap-southeast-2-959756151844,S3Key=github-actions/${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.zip"

      # Step 6: Deploy application
      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name Online-Bookstore-env \
            --version-label "${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
